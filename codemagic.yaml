workflows:
  android-apk:
    name: Android APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Set up project
        script: |
          flutter create . --org com.pharmaintel --project-name pharma_intel --platforms android
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
